<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <main class="container py-5">
        <div class="row g-3">
            <div class="col-lg-4 col-sm-12">
                <div class="card border-primary">
                    <div class="card-header fs-3 bg-primary text-white">
                        Ungoi 1
                        <span class="fs-4 float-end rounded-circle bg-danger px-3 text-dark pb-1">x</span>
                    </div>
                    <div class="card-body menu-item-bg">
                        <img src="assets/1.png" alt="Ungoi 1" class="img-fluid menu-item">
                    </div>
                    <div class="d-flex justify-content-between p-3">
                        <span class="text-primary">Bongo</span>
                        <span class="text-warning bold rounded px-2">69/100</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-sm-12">
                <div class="card border-primary">
                    <div class="card-header fs-3 bg-primary text-white">
                        Ungoi 2
                        <span class="fs-4 float-end rounded-circle bg-danger px-3 text-dark pb-1">x</span>

                    </div>
                    <div class="card-body menu-item-bg">
                        <img src="assets/2.png" alt="Ungoi 2" class="img-fluid menu-item">
                    </div>
                    <div class="d-flex justify-content-between p-3">
                        <span class="text-primary">Koko</span>
                        <span class="text-warning bold rounded px-2">87/100</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-sm-12">
                <div class="card border-primary">
                    <div class="card-header fs-3 bg-primary text-white">
                        Ungoi 3
                        <span class="fs-4 float-end rounded-circle bg-danger px-3 text-dark pb-1">x</span>
                    </div>
                    <div class="card-body menu-item-bg">
                        <img src="assets/3.png" alt="Ungoi 3" class="img-fluid menu-item">
                    </div>
                    <div class="d-flex justify-content-between p-3">
                        <span class="text-primary">Milo</span>
                        <span class="text-warning bold rounded px-2">94/100</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
